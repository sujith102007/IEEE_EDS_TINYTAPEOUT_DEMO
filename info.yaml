# Tiny Tapeout project information
project:
  title:        "1-Bit Half Adder"
  author:       "Sujith M"
  discord:      ""
  description:  "A 1-bit half adder that adds two binary inputs and produces SUM and CARRY outputs using XOR and AND logic."
  language:     "Verilog"
  clock_hz:     0

  # How many tiles your design occupies
  tiles: "1x1"

  # Top module name
  top_module:  "tt_um_example"

  # Source files
  source_files:
    - "project.v"


# The pinout of your project
pinout:
  # Inputs
  ui[0]: "A"
  ui[1]: "B"
  ui[2]: "Unused"
  ui[3]: "Unused"
  ui[4]: "Unused"
  ui[5]: "Unused"
  ui[6]: "Unused"
  ui[7]: "Unused"

  # Outputs
  uo[0]: "SUM"
  uo[1]: "CARRY"
  uo[2]: "Unused"
  uo[3]: "Unused"
  uo[4]: "Unused"
  uo[5]: "Unused"
  uo[6]: "Unused"
  uo[7]: "Unused"

  # Bidirectional pins
  uio[0]: "Unused"
  uio[1]: "Unused"
  uio[2]: "Unused"
  uio[3]: "Unused"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"


# Do not change!
yaml_version: 6
